services:

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      POSTGRES_DB: cantine_django
      POSTGRES_USER: cantine
      POSTGRES_PASSWORD: cantine
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cantine_django
      POSTGRES_USER: cantine
      POSTGRES_PASSWORD: cantine
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: